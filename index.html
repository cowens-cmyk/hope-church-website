<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- Page title, description, canonical and social tags are injected per-route
       by src/seo.jsx (build time for pre-rendered HTML, and on the client during
       navigation). Intentionally none hard-coded here, so no page ends up with
       duplicate head tags. -->
  <link rel="icon" href="/assets/icon-blue.png"/>

  <link rel="stylesheet" href="/assets/site.css"/>
  <link rel="stylesheet" href="/assets/kids-ministry.css"/>
  <link rel="stylesheet" href="/assets/linked56-ministry.css"/>
  <link rel="stylesheet" href="/assets/students-ministry.css"/>
  <link rel="stylesheet" href="/assets/college-ministry.css"/>
  <link rel="stylesheet" href="/assets/women-ministry.css"/>
  <link rel="stylesheet" href="/assets/men-ministry.css"/>
  <link rel="stylesheet" href="/assets/worship-ministry.css"/>
  <link rel="stylesheet" href="/assets/fueledbyhope-ministry.css"/>
  <link rel="stylesheet" href="/assets/give-page.css"/>
  <link rel="stylesheet" href="/assets/podcast-prayer.css"/>
  <link rel="stylesheet" href="/assets/dark-mode.css"/>

  <!-- Theme detection — runs BEFORE React so there's no flash of light mode.
       Resolution order:
         1. ?theme= URL param (light|dark)
         2. Explicit saved preference (light|dark)
         3. OS system preference (prefers-color-scheme)
         4. Local clock fallback — dark from 7:00pm through 6:59am
       Also keeps the theme in sync if the OS preference changes while open. -->
  <script>
    (function () {
      function clockTheme() {
        var h = new Date().getHours();
        return (h >= 19 || h < 7) ? 'dark' : 'light';
      }
      function systemTheme() {
        try {
          if (window.matchMedia) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
            if (window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
          }
        } catch (e) {}
        return null;
      }
      function urlTheme() {
        try {
          var p = new URLSearchParams(window.location.search).get('theme');
          if (p === 'light' || p === 'dark') return p;
        } catch (e) {}
        return null;
      }
      function resolveTheme() {
        var u = urlTheme();
        if (u) return u;
        try {
          var saved = localStorage.getItem('hope_theme'); // 'light' | 'dark' (auto removes key)
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (e) {}
        return systemTheme() || clockTheme();
      }
      function applyResolved() {
        document.documentElement.dataset.theme = resolveTheme();
      }
      applyResolved();
      // Live-follow the OS toggle while the tab is open (matters only in Auto
      // mode — a saved value still wins inside resolveTheme).
      try {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.addEventListener) mq.addEventListener('change', applyResolved);
        else if (mq && mq.addListener) mq.addListener(applyResolved);
      } catch (e) {}
    })();
  </script>

  <!-- Brand image paths now live in src/resources.js (imported by components)
       so they are available during static pre-rendering, not just in-browser. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
